<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1419" />
    <title>en-fr-chinese-entry-mvp</title>
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        gap: 1.2rem;
        justify-items: center;
        background: #f7f8fb;
        color: #08090d;
      }
      #app-boot img {
        width: 4.5rem;
        height: auto;
        animation: app-boot-pulse 1.6s ease-in-out infinite;
      }
      #app-boot p {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(
          90deg,
          #149e8f 0%,
          #2fb8ad 30%,
          #0a6b60 60%,
          #149e8f 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: app-boot-shimmer 2.2s linear infinite;
      }
      @keyframes app-boot-shimmer {
        to {
          background-position: -200% 0;
        }
      }
      @keyframes app-boot-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.72;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot img,
        #app-boot p {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        #app-boot {
          color-scheme: dark;
          background: #0f1419;
          color: #e8edf2;
        }
        #app-boot p {
          background-image: linear-gradient(
            90deg,
            #7fe3db 0%,
            #3fd0c4 30%,
            #2fb8ad 60%,
            #7fe3db 100%
          );
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot" role="status" aria-live="polite">
        <img src="/favicon.svg" alt="" width="72" height="69" />
        <p>轻松学中文</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
